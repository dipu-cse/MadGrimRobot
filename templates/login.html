
<!DOCTYPE html>
<html>
<head>
    <title>Login - Accounting App</title>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 40px auto; padding: 20px; }
        .form { margin: 20px 0; }
        input { width: 100%; padding: 8px; margin: 8px 0; }
        button { width: 100%; padding: 10px; background: #4CAF50; color: white; border: none; }
        .flash { padding: 10px; background: #ff9999; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Login</h1>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <div class="form">
        <form method="post">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
